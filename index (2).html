 <${Sel} l="Operador" v=${fo} set=${setO} opts=${[['all','Todos'],...RAW.ops.map(o=>[o,o])]}/>
 <${Num} l="Mín. kg" v=${mn} set=${setMn}/><${Num} l="Máx. kg" v=${mx} set=${setMx}/><${Num} l="Objetivo kg" v=${tg} set=${setTg}/><${Num} l="Pocas pacas <" v=${low} set=${setLow}/></div>
 <div class="k">${K.map(([l,v,c])=>html`<div class="kc" style=${{'--c':c}}><span>${l}</span><b>${v}</b></div>`)}</div>
 <div class="g">
 <${Card} cls="full" t=${multi?'Producción mensual':'Producción diaria'} s="Barras: pacas y kg · línea: peso promedio por paca (kg)">
  <div style=${{height:300}}><${ResponsiveContainer}><${ComposedChart} data=${daily}><${CartesianGrid} vertical=${false}/><${XAxis} dataKey="name" fontSize=${11}/>
  <${YAxis} yAxisId="kg" fontSize=${11}/><${YAxis} yAxisId="p" orientation="right" fontSize=${11}/><${YAxis} yAxisId="a" hide=${true} domain=${[300,500]}/>
  <${Tooltip} content=${html`<${Tip}/>`}/><${Legend}/>
  <${Bar} yAxisId="kg" dataKey="kg" name="Kg" fill=${C.kg} radius=${[3,3,0,0]}/><${Bar} yAxisId="p" dataKey="p" name="Pacas" fill=${C.p} radius=${[3,3,0,0]}/>
  <${Line} yAxisId="a" dataKey="avg" name="Peso prom. (kg)" stroke=${C.avg} strokeWidth=${2} dot=${{r:3}}/><//><//></div>
  ${multi&&html`<div>${daily.slice(1).map((d,i)=>{const p=daily[i],pc=(a,b)=>b?((a/b-1)*100).toFixed(1)+'%':'–';return html`<span class="chip"><b>${d.name}</b> vs ${p.name}: kg ${pc(d.kg,p.kg)} · pacas ${pc(d.p,p.p)} · prom. ${fmt(d.avg-p.avg)} kg</span>`})}</div>`}<//>
 <${Card} cls="full" t="Comparativa por turno" s="Pacas, kg totales y peso promedio por turno"><div class="t3">${mini('p','Pacas',0,v=>v)}${mini('kg','Kg totales',0,v=>v)}${mini('avg','Peso promedio (kg)',0,v=>v)}</div><//>
 <${Card} t="Comparativa por operador" s=${'Pacas y kg · ⚠ = menos de '+low+' pacas (el promedio, en el tooltip, puede engañar)'}>
  <div style=${{height:290}}><${ResponsiveContainer}><${BarChart} data=${ops}><${CartesianGrid} vertical=${false}/><${XAxis} dataKey="name" fontSize=${11}/><${YAxis} yAxisId="kg" fontSize=${11}/><${YAxis} yAxisId="p" orientation="right" fontSize=${11}/><${Tooltip} content=${html`<${Tip}/>`}/><${Legend}/>
  <${Bar} yAxisId="kg" dataKey="kg" name="Kg" fill=${C.kg}>${ops.map(o=>html`<${Cell} fill=${C.kg} fillOpacity=${o.f?.35:1}/>`)}<//>
  <${Bar} yAxisId="p" dataKey="p" name="Pacas" fill=${C.p}>${ops.map(o=>html`<${Cell} fill=${C.p} fillOpacity=${o.f?.35:1}/>`)}<//><//><//></div><//>
 <${Card} t="Control de calidad del peso" s=${'Rango '+mn+'–'+mx+' kg · '+nl+' pacas bajo mínimo ('+(kgs.length?(nl/kgs.length*100).toFixed(1):0)+'%) · '+nh+' sobre máximo ('+(kgs.length?(nh/kgs.length*100).toFixed(1):0)+'%)'}>
  <div style=${{height:290}}><${ResponsiveContainer}><${BarChart} data=${bins} barCategoryGap=${1}><${CartesianGrid} vertical=${false}/><${XAxis} dataKey="name" fontSize=${10}/><${YAxis} fontSize=${11}/><${Tooltip} content=${html`<${Tip}/>`}/><${Legend}/>
  <${Bar} stackId="a" dataKey="low" name=${'< '+mn+' kg'} fill=${C.low}/><${Bar} stackId="a" dataKey="ok" name="En rango" fill=${C.kg}/><${Bar} stackId="a" dataKey="high" name=${'> '+mx+' kg'} fill=${C.high}/>
  <${ReferenceLine} x=${String(Math.floor(tg/10)*10)} stroke=${C.p} strokeWidth=${2} strokeDasharray="5 3" label=${{value:'Objetivo '+tg,fill:C.p,fontSize:11,position:'top'}}/><//><//></div><//>
 <${Card} cls="full" t="Turno × día" s="Kg por turno y día (más oscuro = más producción)"><div class="x"><table class="hm"><tr><th></th>${days.map(d=>html`<th style=${{textAlign:'center'}}>${+d.slice(8)}</th>`)}</tr>
  ${[1,2,3].map(t=>html`<tr><th>Turno ${t}</th>${days.map(d=>{const v=cell[t+'|'+d],i=v?v/hmax:0;return html`<td title=${fd(d)+' · Turno '+t+': '+fmt(v||0)+' kg'} style=${{background:v?`rgba(15,118,110,${.12+.88*i})`:'transparent',color:i>.55?'#fff':'inherit'}}>${v?(v/1000).toFixed(1)+'t':'·'}</td>`})}</tr>`)}</table></div><//>
 <${Card} t="5 pacas más pesadas" s="Operador, turno y fecha"><div class="x">${tbl(top)}</div><//>
 <${Card} t="5 pacas más ligeras" s="Operador, turno y fecha"><div class="x">${tbl(bot)}</div><//>
 </div></div>`;
}
